aid: tagged
name: Tagged
description: >-
  Tagged is a social discovery and dating platform founded in 2004 and based in
  San Francisco, where members browse profiles of people nearby or worldwide,
  chat, play social games, exchange tags and virtual gifts, and make new
  connections. Originally a standalone social network backed by early investors
  including Uncork Capital (formerly SoftTech VC), Tagged was acquired by MeetMe
  in 2017 for roughly 60 million dollars and today operates as a consumer brand
  within The Meet Group (part of the ParshipMeet Group) alongside apps such as
  MeetMe, Skout, and LOVOO. The current tagged.com is a consumer-facing web and
  mobile social-dating experience with no public developer program or API; a
  legacy REST-style API (tagged.com/api.php) that once powered third-party
  integrations has been retired. This profile is maintained in the API
  Evangelist network as a company record rather than an API producer.
